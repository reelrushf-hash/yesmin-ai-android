name: Build YESMIN AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        uses: digreatbrian/buildozer-action@v1
        with:
          workdir: .
          buildozer-cmd: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yesmin-ai-apk
          path: bin/*.apk
          if-no-files-found: error
